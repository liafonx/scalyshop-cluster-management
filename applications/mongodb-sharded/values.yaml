global:
  security:
    ## @param global.security.allowInsecureImages Allows skipping image verification
    allowInsecureImages: true

image:
  registry: docker.io
  repository: liafonx/mongodb-sharded-arm
  tag: "8.0.5"
  digest: ""

shards: 2

shardsvr:
  dataNode:
    replicaCount: 2

auth:
  enabled: true
#  rootPassword: $MONGODB_ROOT_PASSWORD
  replicaSetKey: 14A878CA-7810-4BDB-ADB0-90685CD105C7

