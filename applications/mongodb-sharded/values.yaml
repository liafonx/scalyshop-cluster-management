image:
  debug: true

shards: 2

shardsvr:
  dataNode:
    replicaCount: 2
#
auth:
  enabled: true
  rootPassword: $MONGODB_ROOT_PASSWORD
  replicaSetKey: $MONGODB_REPLICA_SET_KEY

mongos:
  extraVolumes:
    - name: init-scripts
      configMap:
        name: mongodb-init-scripts
  extraVolumeMounts:
    - name: init-scripts
      mountPath: /entrypoint
  command:
    - /bin/sh
    - while ! nc -z mongos 27017
    - do echo 'Waiting for mongos...'
    - done
    - mongosh --host mongos /entrypoint/init-sharding.js

#metrics:
#  enabled: true

