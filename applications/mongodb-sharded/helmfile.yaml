repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: mongodb-sharded
    namespace: gitlab-managed-apps
    chart: bitnami/mongodb-sharded
    version: 9.1.3
    installed: true
    values:
      - values.yaml

resources:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: mongodb-init-scripts
      namespace: gitlab-managed-apps
    data:
      init-sharding.js: |-
        {{ .Files.Get "init-sharding.js" | indent 4 }}
