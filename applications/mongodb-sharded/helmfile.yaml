repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: init-scripts
    namespace: gitlab-managed-apps
    chart: ./init-scripts
    installed: true

  - name: mongodb-sharded
    namespace: gitlab-managed-apps
    chart: bitnami/mongodb-sharded
    version: 9.1.3
    installed: true
    values:
      - values.yaml