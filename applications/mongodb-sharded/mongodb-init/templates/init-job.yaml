apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mongodb-sharded
  namespace:
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      name: {{ .Release.Name }}
    spec:
      containers:
      - name: mongodb-init
        # Use the same image as your MongoDB deployment (adjust if needed)
        image: "docker.io/bitnami/mongodb-sharded:8.0.5-debian-12-r0"
        command:
          - /bin/bash
          - -c
          - |
            echo "Waiting for mongos to be ready..."
            until nc -z mongodb-sharded 27017; do
              echo "Mongos not ready, sleeping..."
              sleep 5
            done
            echo "Mongos is up. Running initialization commands..."
            mongosh admin --host mongodb-sharded \
              --u root --p "{{ .Values.rootPassword }}" \
              --authenticationDatabase admin \
              --eval '
                db = db.getSiblingDB('scalyDB');

                db.createUser({
                    user: "scaly",
                    pwd: "scalypw",
                    roles: [
                        { role: "readWrite", db: "scalyDB" }
                    ]
                });

                db.createCollection('favorites');
                db.createCollection('orders');
                db.createCollection('products');

                sh.enableSharding("scalyDB");

                sh.shardCollection("scalyDB.favorites", {"productId": "hashed"});
                sh.shardCollection("scalyDB.orders", {orderRef: "hashed"});
                sh.shardCollection("scalyDB.products", {name: "hashed"});`
              '
      restartPolicy: OnFailure